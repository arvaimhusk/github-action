name: Say Hello

on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo "Hello B !"

      - name: Print My pasth
        run: pwd

      - name: print folder including hidden in long format
        run: ls -la

      #- name: fail on purpose
      #  run: exit 1

      - name: pass on purpose
        run: exit 0

  checking:
    runs-on: ubuntu-latest
    steps:
      - name: checkout to code
        uses: actions/checkout@v4
      - run: ls -la

      - name: install specific node
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
      - run: node -v


  # playwright-test:
  #   runs-on: ubuntu-latest
  #   steps:
  #       - uses: actions/checkout@v4
  #       - uses: actions/setup-node@v4
  #       - run: npm init playwright@latest
  #       - run: playwright -v


  using-environment-variables:
    runs-on: ubuntu-latest
    env:
      NAME: shivakumar
    steps:
      - run: echo "$NAME"

  github-secretes:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{secrets.NAME}}"


  fail-this-intentionally:
    runs-on: ubuntu-latest
    steps:
      - name: fail this job
        run: exit 0

  this-job-skipped-because-of-prev-job-exit:
    needs: fail-this-intentionally
    runs-on: ubuntu-latest
    steps:
      - name: this is simply a job that get's skipped
        run: node -v

  using-var-diff-steps:
    runs-on: ubuntu-latest
    steps:
      - name: store key and value onto output
        id: picker
        run: echo "color=red" >> $GITHUB_OUTPUT

      - name: access color
        run: echo "the color is ${{ steps.picker.outputs.color}}"

      - name: Show machine specs
        run: |
          echo "CPU cores:"; nproc
          echo "Memory:"; free -h
          echo "Disk:"; df -h /
          echo "OS:"; cat /etc/os-release | head -2

  using-if-failure-on-jobs:
      needs: fail-this-intentionally
      if: failure()
      runs-on: ubuntu-latest
      steps:
        - name: check node version
          run: node -v


  using-if-failure-on-step:
    runs-on: ubuntu-latest
    steps:
      - name: intension exit
        run: exit 0

      - name: check node version
        if: failure()
        run: node -v









