name: Say Hello

on: workflow_dispatch

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo "Hello B !"

      - name: Print My pasth
        run: pwd

      - name: print folder including hidden in long format
        run: ls -la

      #- name: fail on purpose
      #  run: exit 1

      - name: pass on purpose
        run: exit 0

  checking:
    runs-on: ubuntu-latest
    steps:
      - name: checkout to code
        uses: actions/checkout@v4
      - run: ls -la

      - name: install specific node
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
      - run: node -v
